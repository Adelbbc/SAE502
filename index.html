<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu du Mort Pion (Tic Tac Toe)</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f0f0f0;
        }

        h1 {
            margin-top: 30px;
        }

        #scores {
            font-size: 20px;
            margin-top: 10px;
            font-weight: bold;
        }

        #tour {
            font-size: 20px;
            margin-top: 10px;
        }

        #jeu {
            width: 300px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 5px;
        }

        .case {
            width: 100px;
            height: 100px;
            background: white;
            border: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            cursor: pointer;
        }

        #message {
            font-size: 22px;
            margin-top: 20px;
            font-weight: bold;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            margin-top: 15px;
            cursor: pointer;
        }

        footer {
            margin-top: 40px;
            padding: 15px;
            font-size: 18px;
            color: #333;
        }

        /* POPUP HISTORIQUE */
        #popupHistorique {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #333;
            display: none;
            text-align: left;
        }

        #popupHistorique h3 {
            text-align: center;
        }

        #closePopup {
            margin-top: 10px;
            width: 100%;
        }

    </style>
</head>

<body>

    <h1>Jeu du Mort Pion</h1>

    <div id="scores">
        <h2>Scores</h2>
        <p>X : <span id="scoreX">0</span> | O : <span id="scoreO">0</span></p>
    </div>

    <div id="tour">Tour du joueur : X</div>

    <div id="jeu">
        <div class="case" onclick="jouer(0)"></div>
        <div class="case" onclick="jouer(1)"></div>
        <div class="case" onclick="jouer(2)"></div>
        <div class="case" onclick="jouer(3)"></div>
        <div class="case" onclick="jouer(4)"></div>
        <div class="case" onclick="jouer(5)"></div>
        <div class="case" onclick="jouer(6)"></div>
        <div class="case" onclick="jouer(7)"></div>
        <div class="case" onclick="jouer(8)"></div>
    </div>

    <div id="message"></div>

    <button onclick="reset()">Recommencer</button>
    <button onclick="resetScores()">Réinitialiser les scores</button>
    <button onclick="ouvrirHistorique()">Historique</button>

    <!-- POPUP HISTORIQUE -->
    <div id="popupHistorique">
        <h3>Historique des Parties</h3>
        <ul id="listeHistorique"></ul>
        <button id="closePopup" onclick="fermerHistorique()">Fermer</button>
    </div>

    <footer>
        Site réalisé par : 
        <strong>Bouzgarrou Mohamed</strong> /
        <strong>Seremes--Borchel Sylvain</strong> /
        <strong>Mameri Adel</strong>
    </footer>

    <!-- SCRIPT -->
    <script src="script.js"></script>

</body>
</html>
