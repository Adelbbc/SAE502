<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu du Mort Pion (Tic Tac Toe)</title>

    <style>
        * {
            box-sizing: border-box;
        }
    
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #4f46e5, #22c55e);
            color: #111827;
        }
    
        h1 {
            margin-top: 30px;
            margin-bottom: 10px;
            color: #f9fafb;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }
    
        #scores {
            font-size: 18px;
            margin-top: 5px;
            font-weight: bold;
            padding: 10px 20px;
            background: rgba(249, 250, 251, 0.95);
            border-radius: 999px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        }
    
        #scores h2 {
            margin: 0;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #374151;
        }
    
        #scores p {
            margin: 4px 0 0;
            font-size: 16px;
            color: #111827;
        }
    
        /* GRILLE : simple et bien visible */
        #jeu {
            width: 300px;
            margin: 40px auto 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
    
        .case {
            width: 100px;
            height: 100px;
            background: #ffffff;
            border: 3px solid #111827;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease,
                        box-shadow 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
    
        .case:hover {
            background: #e5f2ff;
            border-color: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        }
    
        .case:active {
            transform: translateY(0);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            background: #dbeafe;
        }
    
        #message {
            font-size: 20px;
            margin-top: 15px;
            font-weight: bold;
            color: #f9fafb;
            min-height: 26px; /* pour éviter le rond vide */
        }
    
        button {
            padding: 10px 22px;
            font-size: 16px;
            margin: 12px 6px 0;
            cursor: pointer;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #f9fafb;
            font-weight: 600;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.45);
            transition: transform 0.1s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }
    
        button:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.6);
        }
    
        button:active {
            transform: translateY(0);
            box-shadow: 0 6px 14px rgba(15, 23, 42, 0.35);
        }
    
        footer {
            margin-top: 35px;
            padding: 12px 20px;
            font-size: 16px;
            color: #e5e7eb;
            background: rgba(15, 23, 42, 0.7);
            border-radius: 999px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.8);
        }
    
        footer strong {
            color: #fbbf24;
        }
    
        /* POPUP HISTORIQUE */
        #popupHistorique {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            max-height: 70vh;
            overflow-y: auto;
            background: #f9fafb;
            padding: 18px 20px 16px;
            border-radius: 18px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.6);
            display: none;
            text-align: left;
            z-index: 1000;
        }
    
        #popupHistorique h3 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 12px;
            color: #111827;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 16px;
        }
    
        #listeHistorique {
            padding-left: 18px;
            margin: 0;
        }
    
        #listeHistorique li {
            margin-bottom: 4px;
            font-size: 14px;
            color: #374151;
        }
    
        #closePopup {
            margin-top: 12px;
            width: 100%;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 8px 20px rgba(220, 38, 38, 0.45);
        }
    
        @media (max-width: 480px) {
            #jeu {
                width: 90vw;
            }
    
            .case {
                width: 100%;
                height: 90px;
                font-size: 48px;
            }
    
            button, footer {
                width: 90vw;
                max-width: 320px;
            }
        }
    </style>
    
    
</head>

<body>

    <h1>Jeu du Mort Pion</h1>

    <div id="scores">
        <h2>Scores</h2>
        <p>X : <span id="scoreX">0</span> | O : <span id="scoreO">0</span></p>
    </div>

    <div id="jeu">
        <div class="case" onclick="jouer(0)"></div>
        <div class="case" onclick="jouer(1)"></div>
        <div class="case" onclick="jouer(2)"></div>
        <div class="case" onclick="jouer(3)"></div>
        <div class="case" onclick="jouer(4)"></div>
        <div class="case" onclick="jouer(5)"></div>
        <div class="case" onclick="jouer(6)"></div>
        <div class="case" onclick="jouer(7)"></div>
        <div class="case" onclick="jouer(8)"></div>
    </div>

    <div id="message"></div>

    <button onclick="reset()">Recommencer</button>
    <button onclick="resetScores()">Réinitialiser les scores</button>
    <button onclick="ouvrirHistorique()">Historique</button>

    <!-- POPUP HISTORIQUE -->
    <div id="popupHistorique">
        <h3>Historique des Parties</h3>
        <ul id="listeHistorique"></ul>
        <button id="closePopup" onclick="fermerHistorique()">Fermer</button>
    </div>

    <footer>
        Site réalisé par : 
        <strong>Bouzgarrou Mohamed</strong> / 
        <strong>Seremes--Borchel Sylvain</strong> / 
        <strong>Mameri Adel</strong>
    </footer>

    <script>
        let tour = "X";
        let grille = ["", "", "", "", "", "", "", "", ""];
        let fin = false;

        let scoreX = localStorage.getItem("scoreX") ? parseInt(localStorage.getItem("scoreX")) : 0;
        let scoreO = localStorage.getItem("scoreO") ? parseInt(localStorage.getItem("scoreO")) : 0;

        document.getElementById("scoreX").innerText = scoreX;
        document.getElementById("scoreO").innerText = scoreO;

        let historique = JSON.parse(localStorage.getItem("historique")) || [];

        const combinaisonsGagnantes = [
            [0,1,2], [3,4,5], [6,7,8], 
            [0,3,6], [1,4,7], [2,5,8], 
            [0,4,8], [2,4,6]
        ];

        function jouer(index) {
            if (grille[index] !== "" || fin) return;

            grille[index] = tour;
            document.getElementsByClassName("case")[index].innerText = tour;

            if (verifierGagnant()) {
                document.getElementById("message").innerText = tour + " a gagné !";

                if (tour === "X") {
                    scoreX++;
                    localStorage.setItem("scoreX", scoreX);
                } else {
                    scoreO++;
                    localStorage.setItem("scoreO", scoreO);
                }

                historique.push(tour + " a gagné");
                localStorage.setItem("historique", JSON.stringify(historique));
                
                document.getElementById("scoreX").innerText = scoreX;
                document.getElementById("scoreO").innerText = scoreO;

                fin = true;
                return;
            }

            if (!grille.includes("")) {
                document.getElementById("message").innerText = "Match nul !";

                historique.push("Match nul");
                localStorage.setItem("historique", JSON.stringify(historique));

                fin = true;
                return;
            }

            tour = tour === "X" ? "O" : "X";
        }

        function verifierGagnant() {
            return combinaisonsGagnantes.some(c =>
                grille[c[0]] === tour &&
                grille[c[1]] === tour &&
                grille[c[2]] === tour
            );
        }

        function reset() {
            grille = ["", "", "", "", "", "", "", "", ""];
            fin = false;
            tour = "X";

            document.getElementById("message").innerText = "";

            const cases = document.getElementsByClassName("case");
            for (let c of cases) {
                c.innerText = "";
            }
        }

        function resetScores() {
            scoreX = 0;
            scoreO = 0;
            localStorage.setItem("scoreX", 0);
            localStorage.setItem("scoreO", 0);

            // Si tu veux réinitialiser aussi l’historique, enlève le commentaire ici :
            // historique = [];
            // localStorage.setItem("historique", JSON.stringify([]));

            document.getElementById("scoreX").innerText = 0;
            document.getElementById("scoreO").innerText = 0;

            alert("Scores réinitialisés !");
        }

        function ouvrirHistorique() {
            let ul = document.getElementById("listeHistorique");
            ul.innerHTML = "";

            historique.forEach(item => {
                let li = document.createElement("li");
                li.innerText = item;
                ul.appendChild(li);
            });

            document.getElementById("popupHistorique").style.display = "block";
        }

        function fermerHistorique() {
            document.getElementById("popupHistorique").style.display = "none";
        }

    </script>

</body>
</html>
